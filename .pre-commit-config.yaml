repos:
  - repo: local
    hooks:
      - {id: ruff-check, name: ruff check, entry: bash -c 'cd api && uv run ruff check --fix .', language: system, files: ^api/, pass_filenames: false}
      - {id: ruff-format, name: ruff format, entry: bash -c 'cd api && uv run ruff format .', language: system, files: ^api/, pass_filenames: false}
      - {id: terraform-fmt, name: terraform fmt, entry: terraform fmt -check -recursive infra, language: system, files: ^infra/, pass_filenames: false}
