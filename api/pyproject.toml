[project]
name = "lawata"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=5.0",
    "numpy",
    "rasterio",
    "pystac-client",
    "httpx",
    "fastapi",
    "psycopg[binary]",
    "boto3",
    "mangum",
    "bedrock-agentcore",
    "psycopg-pool>=3.3.3",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "import-linter", "pre-commit", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RET", "D", "T20"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: hits the live Neon database; skipped unless DATABASE_URL is set"]

[tool.importlinter]
root_package = "lawata"

[[tool.importlinter.contracts]]
name = "Feature layers: api > adapters > service > domain"
type = "layers"
layers = ["api", "adapters", "service", "domain"]
containers = ["lawata.imagery", "lawata.analysis", "lawata.detection", "lawata.weather", "lawata.sightings", "lawata.sampling", "lawata.stats", "lawata.agent", "lawata.shared.auth"]

[[tool.importlinter.contracts]]
name = "Shared depends on no feature"
type = "forbidden"
source_modules = ["lawata.shared"]
forbidden_modules = ["lawata.imagery", "lawata.detection", "lawata.weather", "lawata.sightings", "lawata.sampling", "lawata.stats", "lawata.agent", "lawata.api"]

[[tool.importlinter.contracts]]
name = "No feature imports another feature's adapters"
type = "forbidden"
source_modules = ["lawata.detection", "lawata.weather", "lawata.sightings", "lawata.sampling", "lawata.agent", "lawata.analysis"]
forbidden_modules = ["lawata.imagery.adapters"]

[[tool.importlinter.contracts]]
name = "Read-model features are independent (stats reads the database, not other features)"
type = "independence"
modules = ["lawata.sightings", "lawata.sampling", "lawata.stats"]
