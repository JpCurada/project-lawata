name: ci
# Full checks run when merging: PRs into main or staging, and pushes to them.
# Local pre-commit only runs the fast ones (ruff, terraform fmt).
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: api}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run python -m lawata.agent.replay --case all --mock-llm
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
  infra:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: infra}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
